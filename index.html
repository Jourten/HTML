<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>SmartRetail - Lista de Compra</title>
    <script src="codigo.js" defer></script>

</head>
<body>
    <main class="container">
        <header class="header">
            <h1>☺ Mi Lista de Compra</h1>
            <p>SmartRetail Solutions</p>
        </header>

        <section class="input-group">
            <input 
                type="text" 
                id="inputProducto" 
                placeholder="Nombre del producto..."
                autocomplete="off"
            >
            <button id="botonAnadir">Añadir</button>
        </section>

        <section class="stats">
            <article class="stat-box">
                <div class="stat-number" id="totalProductos">0</div>
                <div class="stat-label">Total</div>
            </article>
            <article class="stat-box">
                <div class="stat-number" id="productosComprados">0</div>
                <div class="stat-label">Comprados</div>
            </article>
            <article class="stat-box">
                <div class="stat-number" id="productosPendientes">0</div>
                <div class="stat-label">Pendientes</div>
            </article>
        </section>

        <section class="sectionLista">
            <h2>Productos</h2>
            <ul id="listaCompra"></ul>
            <p class="lista-vacia" id="mensajeListaVacia">
                La lista está vacía. ¡Añade tu primer producto!
            </p>
        </section>

        <footer class="footer">
            <button id="botonReiniciar">Reiniciar</button>
        </footer>
    </main>

</body>
</html>
